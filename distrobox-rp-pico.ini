[fedora-pico-dev]
image=registry.fedoraproject.org/fedora:41

# Isolate the container's home directory (creates a dedicated folder on your host)
home=~/Data/Apps/distrobox/fedora-zephyr-home

# Export/Mount a specific host directory as a volume inside the container
volume=~/Data/Projects/:~/workspace

# Add the VS Code repo securely. (Wrapped in quotes, using 'tee' instead of '>')
pre_init_hooks="sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc && echo -e '[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc' | sudo tee /etc/yum.repos.d/vscode.repo"

# Install VS Code, build systems, and the ARM cross-compilation toolchain
# (Double quotes restore the full list)
additional_packages="code git cmake make gcc gcc-c++ doxygen arm-none-eabi-gcc-cs arm-none-eabi-gcc-cs-c++ arm-none-eabi-binutils arm-none-eabi-newlib"

# Create workspace, clone SDK, update submodules, and set PICO_SDK_PATH.
init_hooks=""

# Container configurations
pull=true
replace=true
